server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Entêtes de sécurité, posés UNE SEULE FOIS, au niveau du serveur.
    #
    # ATTENTION, c'est le piège classique de nginx : un `add_header` écrit dans
    # un bloc `location` n'ajoute pas, il REMPLACE toute la liste héritée. Un
    # `add_header Cache-Control` posé plus bas effaçait donc silencieusement ces
    # six lignes sur chaque chemin servi — mesuré : aucune des réponses ne
    # portait de CSP. C'est pourquoi la mise en cache ci-dessous passe par
    # `expires`, directive d'un autre module, qui n'a pas cet effet de bord.
    #
    # Le site est statique et n'appelle que sa propre origine : la politique
    # peut être étroite, sans 'unsafe-inline' ni 'unsafe-eval'. Les seules
    # origines tierces sont les polices Google, chargées par <link>.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Les images portent un nom stable : cache long.
    location ~* \.(png|jpg|jpeg|svg|ico|woff2)$ {
        expires 30d;
    }

    # La feuille de style et le script changent avec le contenu et ne portent
    # pas d'empreinte dans leur nom : une heure, pas davantage.
    location ~* \.(css|js)$ {
        expires 1h;
    }

    # Jamais de cache sur la page elle-même : une correction de texte doit se
    # voir à la visite suivante, pas le lendemain.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Sonde de vitalité : une réponse qui ne dépend d'aucun fichier.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 1024;
}
