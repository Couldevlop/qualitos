spring:
  datasource:
    # Une base par contexte Spring : les classes de test tournent en
    # parallele et le schema est en `create-drop`. Sur une base nommee
    # partagee, le demarrage d'un second contexte detruit et recree les
    # tables sous les pieds d'un test en cours (defaut constate sur
    # api-iot-hub en integration continue, invisible en local).
    url: jdbc:h2:mem:qualitos_test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: public
    show-sql: false

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/test

logging:
  level:
    com.openlab.qualitos: DEBUG
    org.springframework.security: DEBUG
