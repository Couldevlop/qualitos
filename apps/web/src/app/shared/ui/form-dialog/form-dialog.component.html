<h2 mat-dialog-title>{{ title }}</h2>

<form [formGroup]="formGroup" (ngSubmit)="submitted.emit()">
  <mat-dialog-content>
    <p class="qfd-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    <ng-content></ng-content>
  </mat-dialog-content>

  <!--
    La barre d'actions DIT ce qui bloque.

    Un bouton grisé sans explication est une impasse : l'utilisateur voit qu'il
    ne peut pas valider, jamais pourquoi, et il lui reste à parcourir le
    formulaire à la recherche du champ fautif — d'autant que les erreurs des
    champs restés vides ne s'affichent qu'une fois touchés.
  -->
  <mat-dialog-actions>
    <p class="qfd-blocked" *ngIf="blockedMessage" role="status">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ blockedMessage }}</span>
    </p>

    <div class="qfd-buttons">
      <button mat-button type="button" (click)="cancelled.emit()" [disabled]="submitting">
        {{ cancelLabel }}
      </button>
      <button mat-flat-button [color]="submitColor" type="submit" [disabled]="submitDisabled || submitting">
        <mat-icon *ngIf="!submitting" aria-hidden="true">{{ submitIcon }}</mat-icon>
        <mat-progress-spinner *ngIf="submitting" mode="indeterminate" diameter="18"></mat-progress-spinner>
        {{ submitLabel }}
      </button>
    </div>
  </mat-dialog-actions>
</form>
