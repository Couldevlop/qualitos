<section class="cause-block" *ngFor="let chaine of fiveWhys; trackBy: trackByAnalyse"
         data-test="cinq-pourquoi-bloc">
  <header class="cause-head">
    <h3 i18n="@@nc.detail.five-whys">5 Pourquoi</h3>
    <a mat-stroked-button [routerLink]="['/five-whys', chaine.id]"
       data-test="cinq-pourquoi-ouvrir">
      <mat-icon>open_in_new</mat-icon>
      <span i18n="@@nc.detail.cause-open-whys">Dérouler l’analyse</span>
    </a>
  </header>
  <qos-five-whys-cascade [steps]="chaine.steps"
                         [rootCause]="chaine.rootCause"></qos-five-whys-cascade>
  <!-- La chaine encore vide n'est pas une erreur : elle vient d'etre ouverte,
       et c'est l'ecran dedie qui la deroule. -->
  <p class="cause-empty" *ngIf="!chaine.steps?.length"
     i18n="@@nc.detail.cause-whys-empty">
    Aucun pourquoi n’a encore été posé. Déroulez l’analyse pour commencer.
  </p>
  <p class="cause-root" *ngIf="chaine.rootCause" data-test="cinq-pourquoi-racine">
    <span i18n="@@nc.detail.root-cause">Cause racine</span> : {{ chaine.rootCause }}
  </p>
</section>

<section class="cause-block" *ngFor="let diagramme of ishikawa; trackBy: trackByDiagramme"
         data-test="ishikawa-bloc">
  <header class="cause-head">
    <h3 i18n="@@nc.detail.ishikawa">Ishikawa</h3>
    <a mat-stroked-button [routerLink]="['/ishikawa', diagramme.id]"
       data-test="ishikawa-ouvrir">
      <mat-icon>open_in_new</mat-icon>
      <span i18n="@@nc.detail.cause-open-ishikawa">Travailler le diagramme</span>
    </a>
  </header>
  <qos-ishikawa-fishbone [problem]="diagramme.problemStatement"
                         [branches]="fishboneBranches(diagramme)"
                         (causeActivate)="openCause(diagramme)"></qos-ishikawa-fishbone>
  <p class="cause-empty" *ngIf="!diagramme.causes?.length"
     i18n="@@nc.detail.cause-ishikawa-empty">
    Aucune cause n’a encore été posée sur ce diagramme.
  </p>
</section>
