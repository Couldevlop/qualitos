<div class="qos-page">
  <qos-page-header
    title="5 Pourquoi" i18n-title="@@fivewhys.list-title"
    subtitle="Remonter d'un écart constaté à sa cause racine, un pourquoi après l'autre."
    i18n-subtitle="@@fivewhys.list-subtitle">
  </qos-page-header>

  <div class="state-row" *ngIf="loading" role="status">
    <mat-progress-spinner mode="indeterminate" diameter="32"
                          aria-label="Chargement" i18n-aria-label="@@common.loading-aria"></mat-progress-spinner>
  </div>

  <p class="empty" *ngIf="!loading && analyses.length === 0" i18n="@@fivewhys.list-empty">
    Aucune analyse pour l'instant. Une analyse se lance depuis une non-conformité.
  </p>

  <div class="qos-scroll-x" *ngIf="analyses.length > 0">
    <table mat-table [dataSource]="analyses" class="fw-table">

      <ng-container matColumnDef="nc">
        <th mat-header-cell *matHeaderCellDef i18n="@@fivewhys.col-nc">Non-conformité</th>
        <td mat-cell *matCellDef="let a"><code>{{ a.ncReference }}</code></td>
      </ng-container>

      <ng-container matColumnDef="problem">
        <th mat-header-cell *matHeaderCellDef i18n="@@fivewhys.col-problem">Problème</th>
        <td mat-cell *matCellDef="let a">{{ a.problem }}</td>
      </ng-container>

      <ng-container matColumnDef="depth">
        <th mat-header-cell *matHeaderCellDef i18n="@@fivewhys.col-depth">Pourquoi</th>
        <td mat-cell *matCellDef="let a">{{ a.steps?.length || 0 }}</td>
      </ng-container>

      <ng-container matColumnDef="rootCause">
        <th mat-header-cell *matHeaderCellDef i18n="@@fivewhys.col-root">Cause racine</th>
        <td mat-cell *matCellDef="let a">
          <span class="qos-badge" data-tone="success" *ngIf="a.rootCause"
                i18n="@@fivewhys.concluded">Conclue</span>
          <span class="dim" *ngIf="!a.rootCause" i18n="@@fivewhys.in-progress">En cours</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;" class="fw-row"
          (click)="open(row)" tabindex="0" (keyup.enter)="open(row)"></tr>
    </table>
  </div>
</div>
