<div class="qos-page">
  <qos-page-header
    eyebrow="Idées" i18n-eyebrow="@@ideas.eyebrow"
    title="Boîte à idées" i18n-title="@@ideas.title"
    subtitle="Déposez une idée, soutenez-la d'une voix : l'arbitrage retient, écarte ou marque réalisée."
    i18n-subtitle="@@ideas.subtitle">
    <button qosActions mat-flat-button color="primary" type="button" (click)="deposer()">
      <mat-icon aria-hidden="true">add</mat-icon>
      <span i18n="@@ideas.submit-button">Déposer une idée</span>
    </button>
  </qos-page-header>

  <!-- Quatre colonnes seulement : une idée dont l'impact a été mesuré reste
       réalisée, et REJECTED n'a pas sa place ici — une colonne de refus
       permanente découragerait le dépôt suivant (cf. la bascule ci-dessous). -->
  <section class="tableau" role="list">
    <section class="colonne" *ngFor="let colonne of colonnes; trackBy: trackByColonne" role="listitem">
      <h2 class="colonne__titre">
        {{ colonne.titre }}
        <span class="colonne__compte" aria-hidden="true">{{ colonne.ideas.length }}</span>
      </h2>

      <ul class="colonne__cartes">
        <li class="carte" *ngFor="let idea of colonne.ideas; trackBy: trackById">
          <h3 class="carte__titre">{{ idea.title }}</h3>
          <p class="carte__description" *ngIf="idea.description">{{ idea.description }}</p>

          <div class="carte__pied">
            <span class="carte__auteur" *ngIf="idea.authorName">{{ idea.authorName }}</span>

            <span class="carte__soutien">
              <span class="carte__voix" aria-hidden="true">{{ idea.votes }}</span>
              <button mat-icon-button type="button" class="carte__vote"
                      *ngIf="idea.voteOpen"
                      [class.carte__vote--actif]="idea.votedByMe"
                      [attr.aria-pressed]="idea.votedByMe"
                      [attr.aria-label]="ariaVote(idea)"
                      [attr.title]="ariaVote(idea)"
                      (click)="basculerVote(idea)">
                <mat-icon>thumb_up</mat-icon>
              </button>
            </span>
          </div>

          <p class="carte__impact" *ngIf="idea.impactNote">{{ idea.impactNote }}</p>

          <!-- Les commandes dépendent du statut de LA carte, pas de la colonne :
               « À l'étude » n'a de sens que sur une idée encore soumise, etc. -->
          <div class="carte__arbitrage" *ngIf="editable">
            <button mat-stroked-button type="button" *ngIf="idea.status === 'PROPOSED'"
                    (click)="etudier(idea)">
              <span i18n="@@ideas.review-button">À l'étude</span>
            </button>

            <ng-container *ngIf="idea.status === 'UNDER_REVIEW'">
              <button mat-stroked-button type="button" (click)="retenir(idea)">
                <span i18n="@@ideas.approve-button">Retenir</span>
              </button>
              <button mat-stroked-button type="button" class="danger" (click)="ecarter(idea)">
                <span i18n="@@ideas.reject-button">Écarter</span>
              </button>
            </ng-container>

            <button mat-stroked-button type="button" *ngIf="idea.status === 'APPROVED'"
                    (click)="realiser(idea)">
              <span i18n="@@ideas.implement-button">Réalisée</span>
            </button>

            <!-- Une idée déjà MEASURED porte déjà son impact : elle ne le
                 redemande pas. -->
            <button mat-stroked-button type="button" *ngIf="idea.status === 'IMPLEMENTED'"
                    (click)="mesurer(idea)">
              <span i18n="@@ideas.measure-button">Consigner l'impact</span>
            </button>
          </div>
        </li>
      </ul>

      <p class="colonne__vide" *ngIf="!loading && colonne.ideas.length === 0"
         i18n="@@ideas.column-empty">
        Aucune idée ici pour l'instant.
      </p>
    </section>
  </section>

  <!-- Les idées écartées restent consultables, mais derrière un geste : une
       colonne de refus permanente découragerait le dépôt suivant. -->
  <section class="ecartees" *ngIf="ecartees.length > 0">
    <button mat-button type="button" class="ecartees__bascule"
            [attr.aria-expanded]="montrerEcartees"
            (click)="montrerEcartees = !montrerEcartees">
      <mat-icon aria-hidden="true">{{ montrerEcartees ? 'expand_less' : 'expand_more' }}</mat-icon>
      <span *ngIf="!montrerEcartees" i18n="@@ideas.show-rejected">
        Voir les idées écartées ({{ ecartees.length }})
      </span>
      <span *ngIf="montrerEcartees" i18n="@@ideas.hide-rejected">Masquer les idées écartées</span>
    </button>

    <ul class="colonne__cartes ecartees__cartes" *ngIf="montrerEcartees">
      <li class="carte carte--ecartee" *ngFor="let idea of ecartees; trackBy: trackById">
        <h3 class="carte__titre">{{ idea.title }}</h3>
        <span class="carte__auteur" *ngIf="idea.authorName">{{ idea.authorName }}</span>
        <p class="carte__motif" *ngIf="idea.rejectionReason">{{ idea.rejectionReason }}</p>
      </li>
    </ul>
  </section>
</div>
