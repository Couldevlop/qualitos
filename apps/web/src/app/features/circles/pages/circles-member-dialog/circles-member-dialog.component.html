<qos-form-dialog
  i18n-title="@@circles.member.title"
  title="Ajouter un membre"
  [formGroup]="form"
  [submitting]="submitting"
  [submitDisabled]="form.invalid"
  i18n-submitLabel="@@common.add"
  submitLabel="Ajouter"
  (submitted)="submit()"
  (cancelled)="cancel()">

  <qos-user-picker class="full" formControlName="userId" required data-test="circle-member"
                   [excludeIds]="data.memberIds ?? []"
                   i18n-label="@@circles.member.person" label="Personne à ajouter"></qos-user-picker>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@circles.detail.role">Rôle</mat-label>
    <mat-select formControlName="role">
      <mat-option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</mat-option>
    </mat-select>
  </mat-form-field>

</qos-form-dialog>
