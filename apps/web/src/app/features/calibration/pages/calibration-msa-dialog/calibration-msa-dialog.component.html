<qos-form-dialog
  i18n-title="@@calibration.msa.title"
  title="Nouvelle étude MSA"
  [formGroup]="form"
  [submitting]="submitting"
  [submitDisabled]="form.invalid"
  i18n-submitLabel="@@common.add"
  submitLabel="Ajouter"
  submitIcon="add"
  (submitted)="submit()"
  (cancelled)="cancel()">

  <div class="row">
    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@calibration.msa.type">Type</mat-label>
      <mat-select formControlName="type" required>
        <mat-option *ngFor="let t of types" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@calibration.record.performed-on">Date</mat-label>
      <input matInput formControlName="performedOn" type="date" required>
    </mat-form-field>
  </div>

  <div class="row">
    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@calibration.msa.value-label">Valeur de l'étude</mat-label>
      <input matInput formControlName="studyValue" type="number" step="any" required>
      <mat-hint i18n="@@calibration.msa.value-hint">Ex. : % GRR, biais mesuré, pente de linéarité.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@calibration.msa.threshold-label">Seuil d'acceptation</mat-label>
      <input matInput formControlName="passingThreshold" type="number" step="any">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@calibration.msa.result">Conclusion</mat-label>
    <mat-select formControlName="result" required>
      <mat-option *ngFor="let r of results" [value]="r.value">{{ r.label }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@calibration.msa.notes">Commentaire</mat-label>
    <textarea matInput formControlName="notes" rows="3" maxlength="2000"></textarea>
  </mat-form-field>

</qos-form-dialog>
