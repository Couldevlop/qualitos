<section class="qos-page restricted" aria-labelledby="restricted-title">
  <div class="qos-empty restricted__box" role="status">
    <span class="qos-empty__icon" aria-hidden="true"><mat-icon>lock</mat-icon></span>
    <h1 id="restricted-title" class="qos-empty__title" i18n="@@restricted.title">Accès réservé à l'administrateur</h1>
    <p class="qos-empty__hint" i18n="@@restricted.hint">Cette page relève de l'administration de votre organisation. Si vous en avez besoin, demandez à votre administrateur de vous attribuer le rôle correspondant.</p>
    <code class="restricted__path" *ngIf="requestedPath">{{ requestedPath }}</code>
    <div class="restricted__actions qos-empty__cta">
      <a mat-flat-button color="primary" routerLink="/home">
        <mat-icon>home</mat-icon>
        <span i18n="@@notfound.home">Retour à l'accueil</span>
      </a>
      <button mat-stroked-button type="button" (click)="back()">
        <mat-icon>arrow_back</mat-icon>
        <span i18n="@@notfound.back">Page précédente</span>
      </button>
    </div>
  </div>
</section>
