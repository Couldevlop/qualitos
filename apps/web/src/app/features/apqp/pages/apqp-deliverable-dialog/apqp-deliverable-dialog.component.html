<qos-form-dialog
  [title]="dialogTitle"
  [subtitle]="data.phaseTitle"
  [formGroup]="form"
  [submitDisabled]="form.invalid"
  [blockedReason]="blockedReason"
  [submitLabel]="submitLabel"
  (submitted)="submit()"
  (cancelled)="cancel()">

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@apqp.deliverable-dialog.field-label">Livrable attendu</mat-label>
    <textarea matInput formControlName="label" rows="2" maxlength="500" required
              i18n-placeholder="@@apqp.deliverable-dialog.label-placeholder"
              placeholder="Ex. : AMDEC processus (PFMEA)"></textarea>
    <mat-hint i18n="@@apqp.deliverable-dialog.label-hint">
      Ce que la phase doit avoir produit avant de passer à la suivante.
    </mat-hint>
    <mat-error *ngIf="form.controls.label.hasError('required')"
               i18n="@@apqp.deliverable-dialog.label-required">
      Un livrable sans intitulé ne se vérifie pas.
    </mat-error>
  </mat-form-field>

  <!-- Un texte libre, et non un genre a choisir : le genre decidait du
       formulaire qu'on verrait en ouvrant le livrable, donc de ce qu'on aurait
       le droit d'y mettre, avant meme d'avoir travaille le sujet. -->
  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@apqp.deliverable-dialog.field-artifact">Artefact attendu</mat-label>
    <textarea matInput formControlName="expectedArtifact" rows="2" maxlength="1000"
              data-test="artefact-attendu"
              i18n-placeholder="@@apqp.deliverable-dialog.artifact-placeholder"
              placeholder="Ex. : tableur signé par le responsable méthodes"></textarea>
    <mat-hint data-test="aide-artefact" i18n="@@apqp.deliverable-dialog.artifact-hint">
      Facultatif. Ce que ce livrable doit produire concrètement : c'est ce qu'on vérifiera.
    </mat-hint>
  </mat-form-field>

  <mat-checkbox formControlName="ppap" data-test="case-ppap">
    <span i18n="@@apqp.deliverable-dialog.ppap">Ce livrable est requis au dossier PPAP</span>
  </mat-checkbox>

</qos-form-dialog>
