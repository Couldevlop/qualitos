<qos-form-dialog
  i18n-title="@@dmaic.measure.title" title="Nouvelle mesure"
  [formGroup]="form"
  [submitting]="submitting"
  [submitDisabled]="form.invalid"
  (submitted)="submit()"
  (cancelled)="cancel()">

  <div formArrayName="values" class="valeurs">
    <div class="valeur" *ngFor="let c of values.controls; let i = index">
      <mat-form-field appearance="outline" class="col">
        <mat-label><span i18n="@@dmaic.detail.col-value">Valeur</span> {{ values.length > 1 ? i + 1 : '' }}</mat-label>
        <input matInput [formControlName]="i" type="number" step="any" [attr.data-test]="'valeur-' + i">
      </mat-form-field>
      <button mat-icon-button type="button" *ngIf="values.length > 1" (click)="removeValue(i)"
              i18n-aria-label="@@dmaic.measure.value-remove" aria-label="Retirer cette valeur">
        <mat-icon>remove_circle_outline</mat-icon>
      </button>
    </div>
    <button mat-button type="button" color="primary" (click)="addValue()" [disabled]="values.length >= maxValues"
            data-test="valeur-ajout">
      <mat-icon>add</mat-icon> <span i18n="@@dmaic.measure.value-add">Ajouter une valeur</span>
    </button>
  </div>

  <div class="row">
    <qos-user-picker class="col" formControlName="operatorId" required
                     label="Personne qui mesure" i18n-label="@@dmaic.measure.operator"
                     data-test="mesureur"></qos-user-picker>
    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@dmaic.measure.datetime-label">Date / heure</mat-label>
      <input matInput formControlName="recordedAt" type="datetime-local">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@dmaic.measure.source-label">Référence source</mat-label>
    <input matInput formControlName="sourceRef" maxlength="255"
           i18n-placeholder="@@dmaic.measure.source-placeholder" placeholder="Ex. : OF-2026-1145, lot-3214">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@dmaic.detail.col-note">Note</mat-label>
    <textarea matInput formControlName="note" rows="2"></textarea>
  </mat-form-field>

</qos-form-dialog>
