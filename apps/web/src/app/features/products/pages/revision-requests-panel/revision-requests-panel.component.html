<div class="state-row" *ngIf="loading" role="status">
  <mat-progress-spinner mode="indeterminate" diameter="32"
                        aria-label="Chargement" i18n-aria-label="@@common.loading-aria"></mat-progress-spinner>
</div>

<p class="empty" *ngIf="!loading && requests.length === 0" i18n="@@revision.none">
  Aucune révision proposée. Les non-conformités et les CAPA closes en déposent ici.
</p>

<div class="cards">
  <mat-card class="revision-card" *ngFor="let request of requests">
    <mat-card-header>
      <mat-card-title>{{ summary(request) }}</mat-card-title>
      <mat-card-subtitle>
        <span class="qos-badge" data-tone="info">{{ request.triggerType }}</span>
        {{ request.triggerRefLabel }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="rationale">{{ request.rationale }}</p>

      <mat-form-field appearance="outline" class="note">
        <mat-label i18n="@@revision.note">Motif de refus</mat-label>
        <textarea matInput rows="2" maxlength="1000"
                  [(ngModel)]="notes[request.id]" [name]="'note-' + request.id"></textarea>
        <mat-hint i18n="@@revision.note-hint">
          Un refus sans motif écrit est l'écart que l'auditeur cherche.
        </mat-hint>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button (click)="reject(request)"
              [disabled]="!canReject(request) || deciding === request.id"
              i18n="@@revision.reject">Refuser</button>
      <button mat-flat-button color="primary" (click)="accept(request)"
              [disabled]="deciding === request.id"
              i18n="@@revision.accept">Accepter</button>
    </mat-card-actions>
  </mat-card>
</div>
