<h2 mat-dialog-title>
  <span *ngIf="!editing" i18n="@@product.dialog-new">Nouveau produit</span>
  <span *ngIf="editing" i18n="@@product.dialog-edit">Modifier le produit</span>
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="product-form">
    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-code">Référence</mat-label>
      <input matInput formControlName="code" maxlength="64" autocomplete="off">
      <mat-hint *ngIf="!editing" i18n="@@product.field-code-hint">
        Lettres, chiffres, point, tiret ou souligné. Elle ne se modifiera plus.
      </mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-designation">Désignation</mat-label>
      <input matInput formControlName="designation" maxlength="250">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-family">Famille</mat-label>
      <input matInput formControlName="family" maxlength="120">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-revision">Indice</mat-label>
      <input matInput formControlName="revisionIndex" maxlength="16">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-customer">Client</mat-label>
      <input matInput formControlName="customerLabel" maxlength="250">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-site">Site</mat-label>
      <input matInput formControlName="siteLabel" maxlength="250">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" i18n="@@common.cancel">Annuler</button>
  <button mat-flat-button color="primary" (click)="save()"
          [disabled]="form.invalid || saving" i18n="@@common.save">Enregistrer</button>
</mat-dialog-actions>
