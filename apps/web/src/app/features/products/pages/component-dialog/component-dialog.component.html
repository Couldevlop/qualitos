<h2 mat-dialog-title>
  <span *ngIf="!editing" i18n="@@product.component-new">Ajouter un composant</span>
  <span *ngIf="editing" i18n="@@product.component-edit">Modifier le composant</span>
</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="component-form">
    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-sequence">Rang</mat-label>
      <input matInput type="number" formControlName="sequenceNo" min="0">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-reference">Référence</mat-label>
      <input matInput formControlName="reference" maxlength="120">
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label i18n="@@product.field-label">Libellé</mat-label>
      <input matInput formControlName="label" maxlength="250">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-quantity">Quantité</mat-label>
      <input matInput type="number" formControlName="quantity" step="any">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label i18n="@@product.field-unit">Unité</mat-label>
      <input matInput formControlName="unit" maxlength="24">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" i18n="@@common.cancel">Annuler</button>
  <button mat-flat-button color="primary" (click)="save()"
          [disabled]="form.invalid || saving" i18n="@@common.save">Enregistrer</button>
</mat-dialog-actions>
