<qos-form-dialog
  i18n-title="@@capa.edit.title"
  title="Modifier le cas CAPA"
  [formGroup]="form"
  [submitting]="submitting"
  [submitDisabled]="form.invalid"
  i18n-submitLabel="@@common.save"
  submitLabel="Enregistrer"
  (submitted)="submit()"
  (cancelled)="cancel()">

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@common.title">Titre</mat-label>
    <input matInput formControlName="title" maxlength="255" required>
    <mat-error *ngIf="form.controls.title.hasError('required')" i18n="@@common.required-field">Champ obligatoire</mat-error>
    <mat-error *ngIf="form.controls.title.hasError('maxlength')" i18n="@@common.maxlength-255">255 caractères maximum.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@common.description">Description</mat-label>
    <textarea matInput formControlName="description" rows="3"></textarea>
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@capa.create.criticity">Criticité</mat-label>
      <mat-select formControlName="criticity" required>
        <mat-option *ngFor="let c of criticities" [value]="c">{{ c | severityLabel }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls.criticity.hasError('required')" i18n="@@common.required-field">Champ obligatoire</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@capa.edit.due-date">Échéance</mat-label>
      <input matInput formControlName="dueDate" type="date">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@capa.edit.source-ref">Référence source</mat-label>
    <input matInput formControlName="sourceRef" maxlength="255">
  </mat-form-field>

  <!-- La vérification d'efficacité (ADR 0073) : le même bloc que la fenêtre
       d'ouverture. Ici, ne pas répondre laisse la question ouverte. -->
  <qos-capa-verification-fields [group]="form"
                                (verifierSelected)="onVerifier($event)"></qos-capa-verification-fields>

</qos-form-dialog>
