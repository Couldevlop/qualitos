<qos-form-dialog
  i18n-title="@@audits.edit.title"
  title="Modifier le plan d'audit"
  [formGroup]="form"
  [submitting]="submitting"
  [submitDisabled]="form.invalid"
  i18n-submitLabel="@@common.save"
  submitLabel="Enregistrer"
  (submitted)="submit()"
  (cancelled)="cancel()">

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@common.title">Titre</mat-label>
    <input matInput formControlName="title" maxlength="255" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@audits.edit.scope">Périmètre</mat-label>
    <textarea matInput formControlName="scope" rows="3"></textarea>
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@common.type">Type</mat-label>
      <mat-select formControlName="type">
        <mat-option *ngFor="let t of types" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="col">
      <mat-label i18n="@@audits.edit.standard">Norme</mat-label>
      <input matInput formControlName="standard" maxlength="100">
    </mat-form-field>
  </div>

  <qos-user-picker class="full" formControlName="leadAuditorId" required
                   data-test="auditeur-responsable"
                   i18n-label="@@audits.lead-auditor" label="Auditeur responsable"
                   i18n-hint="@@audits.lead-auditor.hint-edit"
                   hint="Celui ou celle qui conduit l'audit et signe le rapport."
                   (userSelected)="onLeadAuditor($event)"></qos-user-picker>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@audits.edit.scheduled-date">Date prévue</mat-label>
    <input matInput formControlName="scheduledDate" type="date">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full">
    <mat-label i18n="@@audits.create.reminder-email">Courriel de rappel (optionnel)</mat-label>
    <input matInput formControlName="reminderEmail" type="email" maxlength="320"
           i18n-placeholder="@@audits.create.reminder-email-placeholder"
           placeholder="Ex. : qualite@monentreprise.fr">
    <mat-hint i18n="@@audits.edit.reminder-email-hint">Videz le champ pour ne plus envoyer de rappel par courriel.</mat-hint>
    <mat-error *ngIf="form.controls.reminderEmail.hasError('email')"
               i18n="@@audits.create.reminder-email-invalid">Adresse de courriel invalide.</mat-error>
  </mat-form-field>

</qos-form-dialog>
