<!--
  Le défilement horizontal appartient au CONTENEUR : une arête à quatre
  colonnes dépasse largement un écran de portable, et laisser déborder la page
  entière rendrait toute la lecture bancale.
-->
<div class="fishbone qos-scroll-x" *ngIf="hasDiagram">
  <svg class="fishbone__svg"
       [attr.width]="layout.width"
       [attr.height]="layout.height"
       [attr.viewBox]="'0 0 ' + layout.width + ' ' + layout.height"
       preserveAspectRatio="xMinYMin meet"
       role="group"
       [attr.aria-labelledby]="titleId + ' ' + descId">

    <!--
      `role="group"` et NON `role="img"` : une image est un tout opaque pour les
      technologies d'assistance, qui en ignorent le contenu. Les causes étant
      devenues des boutons focusables, les déclarer sous `img` reviendrait à les
      rendre inatteignables au clavier tout en les laissant cliquables — le pire
      des deux. Idem pour `focusable="false"`, retiré : il empêchait le focus
      d'entrer dans le dessin.
    -->
    <title [attr.id]="titleId">{{ diagramTitle }}</title>
    <desc [attr.id]="descId">{{ diagramDescription }}</desc>

    <defs>
      <marker [attr.id]="arrowId"
              markerWidth="11" markerHeight="11" refX="9" refY="5.5"
              orient="auto" markerUnits="userSpaceOnUse">
        <path class="fishbone__arrow" d="M0,1 L10,5.5 L0,10 z"></path>
      </marker>
    </defs>

    <!-- L'épine : tout converge vers la tête, flèche comprise. -->
    <line class="fishbone__spine"
          [attr.x1]="layout.spineX1" [attr.y1]="layout.spineY"
          [attr.x2]="layout.spineX2" [attr.y2]="layout.spineY"
          [attr.marker-end]="'url(#' + arrowId + ')'"></line>

    <g *ngFor="let bone of layout.bones; trackBy: trackByKey"
       [attr.class]="'fishbone__bone side-' + bone.side + (bone.empty ? ' is-empty' : '')">

      <line class="fishbone__bone-line"
            [attr.x1]="bone.x1" [attr.y1]="bone.y1"
            [attr.x2]="bone.x2" [attr.y2]="bone.y2"></line>

      <rect class="fishbone__branch-box"
            [attr.x]="bone.labelBoxX" [attr.y]="bone.labelBoxY"
            [attr.width]="bone.labelBoxWidth" [attr.height]="bone.labelBoxHeight"
            rx="10" ry="10"></rect>
      <text class="fishbone__branch-label"
            [attr.x]="bone.labelX" [attr.y]="bone.labelY"
            text-anchor="middle">{{ bone.label }}</text>

      <!--
        La cause est FOCUSABLE et cliquable depuis que les cartes de branche ont
        disparu : c'était là qu'on ajoutait un sous-pourquoi, et une figure qu'on
        ne peut que regarder aurait rendu la méthode inutilisable au-delà du
        premier niveau. `role="button"` + `tabindex` parce qu'un `<g>` SVG n'est
        ni l'un ni l'autre par défaut ; la barre d'espace autant que « Entrée »,
        parce qu'un bouton répond aux deux.
      -->
      <g *ngFor="let cause of bone.causes; trackBy: trackByKey"
         class="fishbone__cause-group"
         role="button"
         tabindex="0"
         [attr.aria-label]="causeActionLabel(cause)"
         (click)="causeActivate.emit(cause.key)"
         (keydown.enter)="causeActivate.emit(cause.key)"
         (keydown.space)="$event.preventDefault(); causeActivate.emit(cause.key)">
        <title>{{ causeActionLabel(cause) }}</title>
        <line class="fishbone__tick"
              [attr.x1]="cause.tickX1" [attr.y1]="cause.tickY"
              [attr.x2]="cause.tickX2" [attr.y2]="cause.tickY"></line>
        <text class="fishbone__cause"
              [attr.x]="cause.textX" [attr.y]="cause.textY"
              [attr.text-anchor]="cause.anchor">{{ cause.label }}<!--
            Une cause qui en cache d'autres le dit par un compteur : tracer la
            hiérarchie sur l'oblique la rendrait illisible dès deux niveaux.
          --><tspan class="fishbone__sub" *ngIf="cause.descendants > 0"> {{ subCountLabel(cause.descendants) }}</tspan><!--
            Le score de cause racine, quand il est renseigné : c'est ce qui
            distingue une piste pesée d'une hypothèse de passage.
          --><tspan [attr.class]="'fishbone__score fishbone__score--' + cause.scoreTone" *ngIf="cause.score"> {{ cause.score }}</tspan></text>
      </g>
    </g>

    <!-- La tête porte l'effet observé : c'est le point d'arrivée du dessin. -->
    <g class="fishbone__head">
      <rect class="fishbone__head-box"
            [attr.x]="layout.head.x" [attr.y]="layout.head.y"
            [attr.width]="layout.head.width" [attr.height]="layout.head.height"
            rx="12" ry="12"></rect>
      <text class="fishbone__head-text"
            *ngFor="let line of layout.head.lines"
            [attr.x]="layout.head.textX" [attr.y]="line.y"
            [attr.text-anchor]="layout.head.anchor">{{ line.text }}</text>
    </g>
  </svg>
</div>
