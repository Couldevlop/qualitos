<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>QualitOS — Quality Operating System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="QualitOS — One platform. Five methods. Every industry. Zero compromise.">
  <!-- PWA (§15.2-15.3) : installable, theme-color aligné sur le design system. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a5fb4">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Polices EMBARQUEES, plus aucune requete vers Google Fonts. La CSP du
       cluster impose font-src 'self' : les trois familles etaient bloquees, la
       typographie retombait sur la police systeme et la police d'ICONES ne se
       chargeait pas — chaque icone s'affichant alors sous forme de son libelle
       textuel, ce qui desorganisait le menu et faisait chevaucher les textes.
       Les embarquer corrige cela sans assouplir aucune regle de securite. -->
  <!-- Lien simple, PAS de `preload` + `onload` : la CSP impose script-src
       'self', qui bloque les gestionnaires d'evenements en ligne. La feuille
       n'aurait jamais ete appliquee et les icones seraient restees en texte. -->
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <script>
    // Anti-flash dark : on applique le thème AVANT le rendu Angular.
    (function () {
      try {
        var stored = localStorage.getItem('qos.theme');
        var mode = stored;
        if (!mode || mode === 'system') {
          mode = window.matchMedia &&
                 window.matchMedia('(prefers-color-scheme: dark)').matches
                   ? 'dark' : 'light';
        }
        document.documentElement.classList.add('qos-theme-' + mode);
      } catch (_) {
        document.documentElement.classList.add('qos-theme-light');
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <qos-root>Chargement de QualitOS…</qos-root>
</body>
</html>
