spring:
  application:
    name: api-quality-engine

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qualitos_quality}
    username: ${DB_USER:qualitos}
    password: ${DB_PASSWORD:qualitos}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Socle Kafka (§10.1) — producteur String. Le KafkaTemplate auto-configuré est
  # paresseux : sans broker joignable il ne casse rien tant que le relais (off par
  # défaut) ne publie pas. Broker dev = profil compose 'kafka' (Redpanda).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  jpa:
    hibernate:
      # 'none' au lieu de 'validate': Flyway est la source de verite du schema.
      # 'validate' generait des faux positifs sur @Lob String (Postgres attend
      # oid alors que les migrations Flyway creent TEXT, qui est preferable).
      ddl-auto: none
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
    open-in-view: false
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # En dev, le browser issu via http://localhost:8080 alors qu'api-quality-engine
          # joint Keycloak via http://keycloak:8080 (DNS Docker). Utiliser
          # jwk-set-uri seul (pas issuer-uri) court-circuite la validation
          # stricte de l'issuer claim — la signature reste verifiee.
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:qualitos}/protocol/openid-connect/certs

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # Courriel — rappel d'échéance des audits (§4.4). Tout par variables d'env, AUCUN
  # secret en dur (§18.2.3). L'auto-configuration ne crée un JavaMailSender que si
  # `host` est renseigné : laissé vide (défaut), rien n'est instancié et l'application
  # démarre exactement comme avant. L'interrupteur fonctionnel est `qualitos.mail.enabled`.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          # STARTTLS exigé, pas seulement proposé : `enable` seul se rabat en clair
          # si le serveur ne l'annonce pas — les identifiants partiraient alors en
          # clair sans qu'aucune erreur ne le signale (OWASP A02). `required` fait
          # échouer l'envoi plutôt que de le dégrader en silence.
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          # Sans bornes, un relais qui n'acquitte jamais bloque le thread de
          # l'ordonnanceur indéfiniment : plus aucun rappel ne repart.
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

  # Upload multipart — 1er rempart taille pour les photos de NC (§4.3). Aligné sur
  # le plafond applicatif (10 Mo) : au-delà → 413 (MaxUploadSizeExceededException).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8082
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # OWASP A05 : exposition minimale — pas d'env/heapdump/loggers.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        # SLO §20 : p95 API < 300 ms — buckets alignés pour les alertes Prometheus.
        http.server.requests: 100ms,300ms,800ms

logging:
  level:
    com.openlab.qualitos: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{tenantId:-no-tenant}] %logger{36} - %msg%n"

springdoc:
  # use-fqn : nomme les schémas OpenAPI par nom de classe QUALIFIÉ. Sans ça,
  # springdoc indexe par nom simple → les records homonymes de modules
  # différents (ex. ActivateRequest industry vs tenant-modules, CreateRequest
  # nc vs notification) se télescopent dans #/components/schemas et le doc
  # devient trompeur (un schéma écrase l'autre). BUG #24.
  use-fqn: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Passerelle IA (ai-service) — ADR 0014. Entièrement paramétrable par variables d'env.
qualitos:
  # Relais Kafka outbox (audit_events → topic). OFF par défaut = aucun changement de
  # comportement (le bean AuditEventKafkaRelay n'est même pas créé). §10.1, §13.2.
  kafka:
    enabled: ${QUALITOS_KAFKA_ENABLED:false}
    topic: ${QUALITOS_KAFKA_TOPIC:qualitos.audit-events}
    consumer-group: ${QUALITOS_KAFKA_CONSUMER_GROUP:qualitos-activity-feed}
    webhooks-consumer-group: ${QUALITOS_KAFKA_WEBHOOKS_GROUP:qualitos-webhooks}
    batch-size: ${QUALITOS_KAFKA_BATCH_SIZE:200}
    initial-delay-ms: ${QUALITOS_KAFKA_INITIAL_DELAY_MS:30000}
    fixed-delay-ms: ${QUALITOS_KAFKA_FIXED_DELAY_MS:10000}
  # Palier de facturation appliqué à tous les tenants, tant qu'un module de
  # facturation ne le porte pas par tenant. Le socle du catalogue (modules de
  # base) est acquis d'office quel que soit ce palier ; ce reglage decide de ce
  # que le SUPER ADMIN peut ouvrir au-dela. Fige a FREE dans le code, il rendait
  # toute ouverture impossible sans recompiler.
  modules:
    default-tier: ${MODULES_DEFAULT_TIER:FREE}

  # Brique courriel (§4.4). OFF par défaut, comme le stockage objet et le relais
  # Kafka : sans activation, l'adaptateur SMTP n'est pas créé et le rappel d'audit
  # se limite à la notification interne — qui, elle, fonctionne toujours.
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Adresse d'expédition. Obligatoire dès que `enabled=true` : l'absence fait
    # échouer le DÉMARRAGE, plutôt que le premier envoi un mois plus tard.
    from: ${MAIL_FROM:}

  # Rappel d'échéance des audits planifiés (§4.4).
  audit:
    reminder:
      # 30 jours : un audit se prépare (convocation, preuves, agendas).
      days-before: ${AUDIT_REMINDER_DAYS_BEFORE:30}
      # Plafond d'audits traités par passage — évite qu'un import massif ne se
      # transforme en rafale de courriels dans la même minute.
      batch-size: ${AUDIT_REMINDER_BATCH_SIZE:200}
      # Le rappel se joue à 30 jours, pas à la minute : un balayage horaire suffit.
      initial-delay-ms: ${AUDIT_REMINDER_INITIAL_DELAY_MS:120000}
      fixed-delay-ms: ${AUDIT_REMINDER_FIXED_DELAY_MS:3600000}

  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8085}
    # Timeouts du client HTTP vers ai-service (ms). Le read-timeout DOIT rester
    # supérieur à OLLAMA_TIMEOUT_S (ai-service), lui-même supérieur à la latence du
    # modèle. Pour un modèle plus lent/précis sur CPU (ex. qualitos-sql-lite),
    # relever de concert AI_READ_TIMEOUT_MS et OLLAMA_TIMEOUT_S — aucun code à changer.
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:260000}
    # Mode d'authentification des appels engine -> ai-service (ADR 0014).
    #   dev-claims : en-tete X-Dev-Claims, accepte uniquement si l'ai-service tourne
    #                avec QOS_DEV_AUTH actif. Defaut, pour ne rien casser en local.
    #   bearer     : jeton OIDC client_credentials + en-tete X-Tenant-Id (ADR 0048 :
    #                un tel jeton represente une machine et ne porte aucun tenant ;
    #                l'ai-service ne croit cet en-tete que d'un azp declare dans son
    #                TRUSTED_SERVICE_AZP, qui doit valoir le client-id ci-dessous).
    #                OBLIGATOIRE des que l'ai-service valide reellement les jetons,
    #                donc dans tout environnement deploye — X-Dev-Claims y est
    #                rejete et toutes les fonctions d'IA repondent alors 502.
    # Un mode inconnu fait echouer le demarrage plutot que de retomber sur
    # dev-claims : une degradation silencieuse rouvrirait la faille que ce mode ferme.
    auth: ${AI_AUTH_MODE:dev-claims}
    token-uri: ${AI_TOKEN_URI:}
    client-id: ${AI_CLIENT_ID:api-quality-engine-ai}
    client-secret: ${AI_CLIENT_SECRET:}
    scope: ${AI_SCOPE:}
    token-refresh-margin-s: ${AI_TOKEN_REFRESH_MARGIN_S:30}
    token-connect-timeout-ms: ${AI_TOKEN_CONNECT_TIMEOUT_MS:3000}
    token-read-timeout-ms: ${AI_TOKEN_READ_TIMEOUT_MS:5000}
    # Garde-fous du chemin LLM (OWASP LLM04 — Model DoS), cloisonnés par tenant.
    # Tout est paramétrable par variable d'env, sans toucher au code (§18.2-9).
    guard:
      enabled: ${AI_GUARD_ENABLED:true}
      requests-per-minute: ${AI_GUARD_RPM:20}
      daily-quota: ${AI_GUARD_DAILY_QUOTA:500}
      max-prompt-chars: ${AI_GUARD_MAX_PROMPT_CHARS:20000}
      circuit-failure-threshold: ${AI_GUARD_CIRCUIT_FAILURES:5}
      circuit-open-seconds: ${AI_GUARD_CIRCUIT_OPEN_SECONDS:30}
  # Passerelle Vision 5S (service ai-vision-5s, §3.2 : détection CV des NC 5S sur photo).
  # OFF par défaut = le client ne tente aucun appel réseau et l'endpoint /api/v1/vision/5s/
  # analyze répond 503 « vision-unavailable » (même posture inerte que le module IA sans
  # back-end). Tout est paramétrable par variable d'env, sans toucher au code (§18.2-9).
  vision:
    enabled: ${VISION_ENABLED:false}
    base-url: ${VISION_BASE_URL:http://localhost:8086}
    connect-timeout-ms: ${VISION_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${VISION_READ_TIMEOUT_MS:30000}
    # Mode d'auth interne vers ai-vision-5s (ADR 0021) :
    #   dev-claims (défaut) : en-tête X-Dev-Claims — dev local uniquement (ai-vision-5s
    #                         avec AUTH_BYPASS=true n'exige de toute façon aucun en-tête).
    #   bearer              : jeton OIDC client_credentials Keycloak (aud=api-ai-vision-5s)
    #                         + en-tête X-Tenant-Id — OBLIGATOIRE en prod. Échec d'obtention
    #                         du jeton → 503 vision-unavailable (fail-closed, pas de repli).
    #   none                : aucun en-tête (réseau de confiance/mTLS mesh, déconseillé).
    auth: ${VISION_AUTH:dev-claims}
    # Client de service Keycloak (mode bearer uniquement). Le secret arrive par env/Vault,
    # jamais en clair dans le repo (§18.2-3) ; jamais journalisé (§22-9).
    token-uri: ${VISION_TOKEN_URI:}
    client-id: ${VISION_CLIENT_ID:api-quality-engine-vision}
    client-secret: ${VISION_CLIENT_SECRET:}
    scope: ${VISION_SCOPE:}
    token-refresh-margin-s: ${VISION_TOKEN_REFRESH_MARGIN_S:30}
    token-connect-timeout-ms: ${VISION_TOKEN_CONNECT_TIMEOUT_MS:3000}
    token-read-timeout-ms: ${VISION_TOKEN_READ_TIMEOUT_MS:5000}
  blockchain:
    # Client vers blockchain-service (actif sous le profil "fabric" ; ADR 0012 Phase B).
    service-url: ${BLOCKCHAIN_SERVICE_URL:http://localhost:8090}
    connect-timeout-ms: ${BLOCKCHAIN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${BLOCKCHAIN_READ_TIMEOUT_MS:30000}
  # Stockage binaire S3-compatible (MinIO) des photos de NC (§4.3). OFF par défaut :
  # sans STORAGE_S3_ENABLED=true, l'adaptateur S3 n'est pas créé et les endpoints
  # photos répondent 503. AUCUN secret par défaut en dur (§18.2.3) — endpoint et
  # credentials viennent de l'environnement (dev : docker-compose.dev.yml profil
  # 'storage' ; prod : Vault + ESO).
  storage:
    s3:
      enabled: ${STORAGE_S3_ENABLED:false}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      # Hôte par lequel le NAVIGATEUR atteint le stockage, utilisé pour signer les
      # URLs de lecture. Vide en local, où les deux se confondent ; en cluster, le
      # service interne ne se résout pas depuis un poste et une URL signée sur son
      # nom serait inouvrable sans qu'aucune erreur ne remonte.
      public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:}
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:us-east-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}

    # Balayage des binaires orphelins (§4.3) : un objet écrit juste avant qu'une
    # transaction n'échoue survit à la ligne qui le désignait, et devient alors
    # invisible pour l'application — mais toujours facturé.
    #
    # OFF PAR DÉFAUT, et ce défaut est le seul défendable : le balayage EFFACE des
    # octets qu'aucune sauvegarde applicative ne rappellera. À n'allumer qu'après
    # avoir vérifié que le bucket ne sert qu'à cette plateforme.
    orphan-sweep:
      enabled: ${STORAGE_ORPHAN_SWEEP_ENABLED:false}
      # Âge minimal avant qu'un objet soit tenu pour orphelin. 24 h, pas quelques
      # minutes : en dessous, on effacerait une pièce entre son dépôt et la
      # validation de sa transaction. Refusé au démarrage sous 1 h.
      grace-period: ${STORAGE_ORPHAN_SWEEP_GRACE:PT24H}
      # Objets examinés par passage — plusieurs petits passages valent mieux qu'un
      # seul qui énumère le bucket entier.
      batch-size: ${STORAGE_ORPHAN_SWEEP_BATCH:1000}
      # Quotidien : un orphelin ne bouge pas, et balayer plus souvent
      # interrogerait le stockage pour ne rien trouver.
      initial-delay-ms: ${STORAGE_ORPHAN_SWEEP_INITIAL_DELAY_MS:300000}
      fixed-delay-ms: ${STORAGE_ORPHAN_SWEEP_FIXED_DELAY_MS:86400000}
