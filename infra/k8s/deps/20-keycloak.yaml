# Keycloak 25 — fournisseur d'identité (OIDC) de QualitOS.
#
# Version alignée sur le docker-compose de développement et sur ce qui tourne
# déjà ailleurs dans ce cluster, pour ne pas introduire un écart de version
# entre l'environnement où les realms ont été validés et celui-ci.
#
# Démarrage en mode `start` (production) et non `start-dev` : le mode dev
# désactive la vérification du nom d'hôte et sert en HTTP sans se soucier des
# en-têtes de proxy, ce qui provoque des boucles de redirection derrière un
# ingress qui termine le TLS.
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: qualitos
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: qualitos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: qualitos
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          # --import-realm lit /opt/keycloak/data/import/*.json au démarrage. Le
          # realm (rôles, clients, comptes de démonstration) est fourni par la
          # ConfigMap produite par render-realm.sh. L'import n'a lieu que si le
          # realm n'existe pas encore : relancer le pod ne réécrase donc pas une
          # configuration modifiée depuis la console.
          # Pas de --optimized : ce drapeau n'accepte pas de valeur en Keycloak 25,
          # et la forme --optimized=false était relayée telle quelle au `kc.sh
          # build` implicite, qui la rejetait — le conteneur redémarrait en
          # boucle sur « Unknown option ». Sans le drapeau, Keycloak construit sa
          # configuration au démarrage : quelques secondes de plus, comportement
          # correct.
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - secretRef:
                name: qualitos-keycloak
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: qualitos-postgres, key: POSTGRES_USER }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: qualitos-postgres, key: POSTGRES_PASSWORD }
            # Le TLS est terminé par l'ingress ; sans ces deux réglages Keycloak
            # se croit en HTTP et fabrique des URL d'issuer et de redirection en
            # http://, ce qui casse la découverte OIDC côté navigateur.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            # URL PUBLIQUE COMPLÈTE, pas un simple nom d'hôte. C'est elle qui
            # détermine l'émetteur des jetons : avec un nom seul, Keycloak déduit
            # le schéma et le port de la requête entrante et produisait un
            # émetteur en http://…:8080, que les backends refusent ensuite.
            - name: KC_HOSTNAME
              value: https://__QOS_HOST__
            # Keycloak est servi sous /auth du MÊME hôte que l'application, pour
            # n'exiger qu'un seul enregistrement DNS et un seul certificat.
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            # Expose /health/* et /metrics sur le port 9000, séparé du trafic
            # applicatif — requis depuis Keycloak 25 pour que les sondes
            # répondent sans passer par le port public.
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: realm
          configMap:
            name: qualitos-keycloak-realm
---
# Keycloak doit être joignable depuis le NAVIGATEUR (redirection d'authentification),
# pas seulement depuis les pods. Il est exposé sous /auth de l'hôte applicatif
# plutôt que sur un sous-domaine : un seul enregistrement DNS, un seul certificat.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: qualitos
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # Pas de bloc `tls` ici, volontairement : le certificat de cet hôte est demandé
  # par l'ingress de l'application, et ingress-nginx l'applique au niveau de la
  # connexion TLS, donc à tous les chemins de l'hôte. Deux ingress réclamant le
  # même certificat se disputeraient la même ressource cert-manager.
  rules:
    - host: __QOS_HOST__
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
