# Classes de priorité — l'unique protection de la production sur un nœud unique.
#
# Les deux environnements se partagent la même machine : sa mémoire, son disque,
# son serveur Ollama. Sans hiérarchie déclarée, le kubelet évince sous pression
# selon la seule classe de QoS, et rien ne garantit qu'il choisira la
# préproduction. Un import volumineux lancé pour essai pouvait donc faire tomber
# la production.
#
# Ces classes ne créent AUCUNE ressource : elles fixent l'ordre dans lequel on
# sacrifie. La production passe devant, la préproduction cède. C'est un
# arbitrage, pas une garantie de disponibilité — celle-ci demande un second
# nœud, et tant qu'il n'existe pas la promesse de 99,95 % du CLAUDE.md §2.1
# n'est pas tenue.
#
# Objets à PORTÉE CLUSTER : ils ne vivent dans aucun namespace, et les deux
# environnements les partagent. C'est voulu — une hiérarchie n'a de sens que si
# ses deux termes se comparent.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: qualitos-prod
value: 1000
globalDefault: false
description: "QualitOS production — évincée en dernier."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: qualitos-preprod
value: 100
globalDefault: false
description: "QualitOS préproduction — cède la place à la production."
