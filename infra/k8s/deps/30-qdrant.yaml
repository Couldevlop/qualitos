# Qdrant — magasin vectoriel du RAG (CLAUDE.md §12.2).
#
# Version alignée sur le docker-compose de développement. Le volume conserve les
# collections ingérées : sans lui, chaque redémarrage imposerait de réindexer
# tout le corpus normatif.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qualitos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qualitos
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qualitos
spec:
  replicas: 1
  strategy:
    # Volume ReadWriteOnce : même contrainte que Postgres, deux pods ne peuvent
    # pas monter le volume simultanément.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: qualitos
    spec:
      priorityClassName: __PRIORITY_CLASS__
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.0
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
