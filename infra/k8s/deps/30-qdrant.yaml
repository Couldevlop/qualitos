# Qdrant — magasin vectoriel du RAG (CLAUDE.md §12.2).
#
# Version alignée sur le docker-compose de développement. Le volume conserve les
# collections ingérées : sans lui, chaque redémarrage imposerait de réindexer
# tout le corpus normatif.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qualitos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qualitos
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: qualitos
spec:
  replicas: 1
  strategy:
    # Volume ReadWriteOnce : même contrainte que Postgres, deux pods ne peuvent
    # pas monter le volume simultanément.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: qualitos
    spec:
      # Qdrant démarre en root par défaut. On l'exécute en non-root 1000 ; fsGroup
      # rend le volume de stockage inscriptible par ce compte (chown au montage),
      # sans quoi Qdrant ne pourrait plus écrire ses collections.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Le volume a d'abord servi à Qdrant lancé EN ROOT : ses sous-dossiers
      # appartiennent à root, et fsGroup n'aligne que le groupe, pas le
      # propriétaire — Qdrant en 1000 ne pouvait plus créer son dossier
      # Snapshots (« Permission denied »). Cet initContainer bref réaligne la
      # propriété UNE FOIS ; sur un volume neuf il ne trouve rien à changer. Il
      # est le SEUL conteneur autorisé à tourner en root ici, strictement pour
      # cette remise en ordre, capacités réduites au seul CHOWN.
      initContainers:
        - name: fix-ownership
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 1000:1000 /qdrant/storage"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.11.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Qdrant écrit ses snapshots dans /qdrant/snapshots par défaut — un
          # chemin du système de fichiers de l'image, possédé par root et donc
          # non inscriptible par le compte 1000. On les redirige SOUS le volume
          # persistant (déjà réaligné par l'initContainer), ce qui a l'avantage
          # de les rendre durables plutôt que perdus au redémarrage.
          env:
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
