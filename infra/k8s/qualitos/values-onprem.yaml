# Valeurs FIXES d'une installation on-premise (ADR 0082, 0083).
#
# Ce qui est propre au site (hôte, certificats, registre, classe d'ingress) n'est
# PAS ici : `deploy.sh onprem` le génère depuis `qualitos.conf` et l'ajoute par
# un second fichier de valeurs. Ici, seulement ce qui vaut pour tout client :
#
#   - l'édition on-premise et la licence montée en fichier ;
#   - les services joints par leur nom COURT : l'installation vit dans un seul
#     namespace, quel qu'il soit, et un nom complet le figerait ;
#   - une réplique par service : un serveur client n'est pas un cluster SaaS.

global:
  imagePullPolicy: IfNotPresent
  springProfiles: "prod"

externalServices:
  postgresHost: postgres
  qdrantUrl: http://qdrant:6333
  ollamaUrl: http://ollama:11434

objectStorage:
  enabled: true

services:
  web:
    replicas: 1

  api-core:
    replicas: 1
    env:
      DB_URL: jdbc:postgresql://postgres:5432/qualitos_core
      QUALITY_ENGINE_BASE_URL: http://api-quality-engine:8082
      # Les comptes se créent par l'API d'administration de Keycloak, jointe à
      # l'intérieur du cluster (jamais par l'URL publique, ni le WAF).
      IDENTITY_KEYCLOAK_URL: http://keycloak:8080/auth
      QUALITOS_EDITION: onprem
      QUALITOS_LICENSE_FILE: /etc/qualitos/license/license.lic
    extraSecretRefs: [qualitos-api-core-identity]
    extraSecretMounts:
      - secret: qualitos-license
        mountPath: /etc/qualitos/license

  api-quality-engine:
    replicas: 1
    env:
      DB_URL: jdbc:postgresql://postgres:5432/qualitos_quality
      AI_SERVICE_URL: http://ai-service:8085
      QUALITOS_EDITION: onprem
      QUALITOS_LICENSE_FILE: /etc/qualitos/license/license.lic
      AI_AUTH_MODE: bearer
      # Jeton de service obtenu à l'intérieur du cluster : l'émetteur inscrit
      # dans le jeton reste l'URL publique (KC_HOSTNAME), seul le chemin change.
      AI_TOKEN_URI: http://keycloak:8080/auth/realms/qualitos/protocol/openid-connect/token
      AI_CLIENT_ID: api-quality-engine-ai
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_BUCKET: qualitos-evidence
    extraSecretRefs: [qualitos-api-quality-engine-ai, qualitos-api-quality-engine-storage]
    extraSecretMounts:
      - secret: qualitos-license
        mountPath: /etc/qualitos/license

  api-iot-hub:
    replicas: 1
    env:
      IOT_DB_URL: jdbc:postgresql://postgres:5432/qualitos_iot
      QUALITY_ENGINE_BASE_URL: http://api-quality-engine:8082

  ai-service:
    replicas: 1
    env:
      QOS_ENV: prod
      QOS_DEV_AUTH: "0"
      OLLAMA_TIMEOUT_S: "240"
      AI_DEFAULT_PROVIDER: ollama
      KEYCLOAK_AUDIENCE: qualitos-ai
      TRUSTED_SERVICE_AZP: api-quality-engine-ai
      EMBEDDINGS_PROVIDER: ollama
      EMBEDDINGS_MODEL: bge-m3
      QDRANT_URL: http://qdrant:6333

  # L'ancrage blockchain suppose un réseau Fabric : hors du périmètre d'une
  # installation sur site tant que le client n'en exploite pas un.
  blockchain-service:
    enabled: false

autoscaling:
  enabled: false
