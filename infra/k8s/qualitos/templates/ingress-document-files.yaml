{{- if .Values.ingress.enabled }}
# Route de DÉPÔT des fichiers de la documentation qualité (GED, ADR 0094).
#
# POURQUOI UN INGRESS SÉPARÉ. La taille de corps acceptée et les exclusions du
# pare-feu se déclarent par ressource Ingress, pas par chemin. L'ingress
# principal plafonne les corps à 12 Mo, assez pour une photo de NC ; un manuel
# qualité ou une procédure scannée en dépasse souvent le double. Relever la
# limite sur l'ingress principal l'ouvrirait à toute l'API. Ici, elle ne vaut
# que pour un seul chemin, qui n'accepte qu'un multipart authentifié, borné par
# l'application (taille par client, plafond de plateforme, signature binaire).
#
# 52 Mo : le plafond de plateforme de 50 Mo, plus l'enveloppe multipart. La
# borne qui fait foi reste celle de l'application, qui répond un 413 explicite.
#
# Le certificat de l'hôte vient de l'ingress principal ; l'émetteur n'est pas
# repris ici, deux ressources revendiquant le même secret TLS se le disputeraient.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qualitos-document-files
  labels:
    {{- include "qualitos.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.documentFiles.maxBodySize | quote }}
    # Un dépôt de 50 Mo sur une liaison lente dépasse la minute par défaut.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    {{- if .Values.ingress.snippets }}
    # Le pare-feu (OWASP CRS) lit les corps de requête jusqu'à ~13 Mo et refuse
    # au-delà, avant l'application. Sur ce chemin seulement, il ne lit plus le
    # corps : un fichier binaire n'a pas de champ à inspecter, et c'est
    # l'application qui en vérifie le type à sa signature. Les règles portant sur
    # l'URL, les en-têtes et la méthode restent actives.
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRule REQUEST_URI "@beginsWith /api/v1/document-files/" "id:1000110,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/document-files
            pathType: Prefix
            backend:
              service:
                name: api-quality-engine
                port: { name: http }
{{- end }}
