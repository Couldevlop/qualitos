{{- /*
Un Deployment par entrée .Values.services (enabled=true).
Sécurité (§11, CIS K8s) : runAsNonRoot, rootfs read-only, capabilities drop ALL,
seccomp RuntimeDefault. Les images distroless du repo sont déjà non-root.
Probes : actuator liveness/readiness pour Spring Boot, healthPath sinon.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "qualitos.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "qualitos.labels" $ | nindent 8 }}
      {{- if and $.Values.prometheus.scrapeAnnotations (or $svc.isSpringBoot $svc.metricsPath) }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: {{ $svc.metricsPath | default (ternary "/actuator/prometheus" "/metrics" ($svc.isSpringBoot | default false)) | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # UID NUMÉRIQUE indispensable. Nos images déclarent `USER nonroot`, un
        # NOM ; le kubelet ne sait pas résoudre un nom d'utilisateur dans une
        # image et refuse alors de démarrer le conteneur avec
        # « runAsNonRoot and image has non-numeric user » — l'image a beau être
        # correctement non-root, il ne peut pas le VÉRIFIER. 65532 est l'UID de
        # `nonroot` aussi bien dans les images distroless (services Java) que
        # dans les images Chainguard (services Python), ce qui permet une valeur
        # unique ici.
        # Surchargeable par service : tous nos conteneurs ne partagent pas le
        # même UID. Les images Java (distroless) et Python (Chainguard) exposent
        # `nonroot` en 65532, le frontend nginx non privilégié tourne en 101.
        runAsUser: {{ $svc.runAsUser | default 65532 }}
        runAsGroup: {{ $svc.runAsUser | default 65532 }}
        fsGroup: {{ $svc.runAsUser | default 65532 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "qualitos.image" (dict "root" $ "svc" $svc) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $svc.readOnlyRootFilesystem | default true }}
            capabilities:
              drop: ["ALL"]
          env:
            {{- if $svc.isSpringBoot }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $svc.springProfiles | default $.Values.global.springProfiles | quote }}
            - name: KEYCLOAK_URL
              value: {{ $.Values.global.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ $.Values.global.keycloak.realm | quote }}
            - name: KEYCLOAK_ISSUER_URI
              value: "{{ $.Values.global.keycloak.url }}/realms/{{ $.Values.global.keycloak.realm }}"
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if $svc.secretRef }}
          envFrom:
            # Secret matérialisé par External Secrets Operator depuis Vault (§18.2.3).
            - secretRef:
                name: {{ $svc.secretRef }}
          {{- end }}
          {{- if $svc.isSpringBoot }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          # Un service non-Spring peut exposer une sonde de PRÉPARATION distincte
          # de sa sonde de vitalité — l'ai-service a /healthz et /readyz. Sans
          # `readyPath`, on retombe sur `healthPath`, ce qui reste le comportement
          # attendu pour un service qui n'en expose qu'une (le frontend).
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default dict) | nindent 12 }}
          {{- $writable := $svc.writableDirs | default (ternary (list "/tmp") (list) ($svc.isSpringBoot | default false)) }}
          {{- if $writable }}
          volumeMounts:
            {{- range $i, $dir := $writable }}
            - name: writable-{{ $i }}
              mountPath: {{ $dir }}
            {{- end }}
          {{- end }}
      {{- if $writable }}
      volumes:
        {{/* Le rootfs est monté en lecture seule (durcissement OWASP A05). Les
             quelques répertoires que le conteneur DOIT pouvoir écrire sont
             déclarés par service : /tmp pour la JVM, et pour nginx la sortie de
             son entrypoint (envsubst écrit la conf finale) plus ses caches. Sans
             cette liste, le frontend redémarrait en boucle sur
             « can't create /etc/nginx/conf.d/default.conf: Read-only file
             system », un message qui ne pointe pas vers la cause. */}}
        {{- range $i, $dir := $writable }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
      {{- end }}
{{- end }}
{{- end }}
