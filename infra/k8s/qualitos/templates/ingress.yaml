{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qualitos
  labels:
    {{- include "qualitos.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Le SPA appelle les APIs en chemins relatifs /api/* — l'ingress route
          # par préfixe vers chaque service ; tout le reste va au frontend.
          - path: /api/v1/tenants
            pathType: Prefix
            backend:
              service:
                name: api-core
                port: { name: http }
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: api-core
                port: { name: http }
          # Surface d'ADMINISTRATION de la facturation (profils clients, tarifs
          # des modules, abonnements, factures) : elle vit dans api-core, à côté
          # de /api/v1/tenants, parce que le client facturé est une notion de
          # socle et non de moteur qualité.
          #
          # Sans cette règle, tout /api/v1/admin/** tombait dans la règle
          # fourre-tout /api ci-dessous et partait au moteur qualité, qui n'a
          # aucun de ces chemins : la facturation aurait répondu 404 en
          # préproduction alors qu'elle est complète et testée. nginx-ingress
          # choisit le préfixe le PLUS LONG, l'ordre des règles n'y change rien —
          # mais leur existence, si.
          - path: /api/v1/admin
            pathType: Prefix
            backend:
              service:
                name: api-core
                port: { name: http }
          - path: /api/v1/iot
            pathType: Prefix
            backend:
              service:
                name: api-iot-hub
                port: { name: http }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-quality-engine
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { name: http }
{{- end }}
