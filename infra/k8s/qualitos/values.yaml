# =============================================================================
# QualitOS — values par défaut.
# Sécurité (§11, §18.2) : aucun secret en clair ici — les credentials DB et
# clés API sont injectés via des Secrets K8s référencés par nom, eux-mêmes
# matérialisés par External Secrets Operator depuis Vault (§10.2).
# =============================================================================

global:
  imageRegistry: ghcr.io/couldevlop/qualitos
  imageTag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Profil Spring 'prod' = logs JSON structurés (logback-spring.xml) ;
  # 'tls' (api-core) active le TLS hybride post-quantique (ADR 0015).
  springProfiles: "prod"
  keycloak:
    # Keycloak est déployé à part (chart Bitnami ou opérateur) ou managé.
    url: http://keycloak.qualitos.svc.cluster.local:8080
    realm: qualitos

# Services d'état attendus HORS de ce chart (managés ou charts dédiés).
# Renseignés ici uniquement à titre documentaire / pour les URLs par défaut.
externalServices:
  postgresHost: postgres.qualitos.svc.cluster.local
  kafkaBootstrap: kafka.qualitos.svc.cluster.local:9092
  qdrantUrl: http://qdrant.qualitos.svc.cluster.local:6333
  ollamaUrl: http://ollama.qualitos.svc.cluster.local:11434

serviceAccount:
  create: true
  name: qualitos

# Annotations de scrape Prometheus posées sur chaque pod (operator non requis).
prometheus:
  scrapeAnnotations: true
  # Si le Prometheus Operator est présent, génère aussi des ServiceMonitors.
  serviceMonitor:
    enabled: false
    interval: 30s

networkPolicy:
  # Default-deny ingress + autorisation intra-namespace (zero-trust §11).
  enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: qualitos.example.com
  tls:
    enabled: true
    secretName: qualitos-tls

# -----------------------------------------------------------------------------
# Stockage objet des pièces jointes (photos de NC §4.3, preuves CAPA §4.2).
# Le MinIO lui-même est une dépendance d'état (infra/k8s/deps/50-minio.yaml),
# pas un service du chart : le chart n'a qu'à publier la route de LECTURE.
#
# OFF par défaut : un environnement sans stockage répond 503 sur les pièces
# jointes, et l'écran le dit. Exposer une route vers un service absent
# produirait un 503 nginx, moins parlant.
# -----------------------------------------------------------------------------
objectStorage:
  enabled: false
  # Donne aussi son nom au chemin public (accès S3 « path-style »).
  bucket: qualitos-evidence
  serviceName: minio
  servicePortName: s3

# -----------------------------------------------------------------------------
# Déploiements applicatifs — un bloc = un Deployment + Service générés par les
# templates. `secretRef` désigne un Secret K8s (créé par ESO) injecté en envFrom.
# -----------------------------------------------------------------------------
services:
  web:
    enabled: true
    image: web
    # 8080 et UID 101 : l'image du frontend est la variante NON PRIVILÉGIÉE de
    # nginx. L'image classique démarrait son maître en root, ce que la politique
    # `runAsNonRoot` du chart interdit — le conteneur ne pouvait pas démarrer.
    port: 8080
    runAsUser: 101
    # L'entrypoint officiel de nginx applique envsubst sur les templates et ECRIT
    # le resultat dans /etc/nginx/conf.d ; il lui faut aussi ses caches et /tmp.
    # Avec un rootfs en lecture seule, ces trois chemins doivent etre montes.
    writableDirs: ["/etc/nginx/conf.d", "/var/cache/nginx", "/tmp"]
    replicas: 2
    healthPath: /
    isSpringBoot: false
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }

  api-core:
    enabled: true
    image: api-core
    port: 8081
    replicas: 2
    isSpringBoot: true
    secretRef: qualitos-api-core
    env:
      DB_URL: jdbc:postgresql://postgres.qualitos.svc.cluster.local:5432/qualitos_core
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

  api-quality-engine:
    enabled: true
    image: api-quality-engine
    port: 8082
    replicas: 2
    isSpringBoot: true
    secretRef: qualitos-api-quality-engine
    env:
      DB_URL: jdbc:postgresql://postgres.qualitos.svc.cluster.local:5432/qualitos_quality
      AI_SERVICE_URL: http://ai-service.qualitos.svc.cluster.local:8085
      QUALITOS_KAFKA_ENABLED: "false"
    resources:
      requests: { cpu: 500m, memory: 768Mi }
      limits: { cpu: "2", memory: 1536Mi }

  api-iot-hub:
    enabled: true
    image: api-iot-hub
    port: 8083
    replicas: 1
    isSpringBoot: true
    secretRef: qualitos-api-iot-hub
    env:
      IOT_DB_URL: jdbc:postgresql://postgres.qualitos.svc.cluster.local:5432/qualitos_iot
      QUALITY_ENGINE_BASE_URL: http://api-quality-engine.qualitos.svc.cluster.local:8082
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

  ai-service:
    enabled: true
    image: ai-service
    port: 8085
    replicas: 1
    # L'ai-service expose /healthz et /readyz (presentation/routers/health_router.py).
    # Le chart pointait sur /health, qui répond 404 : les sondes n'auraient JAMAIS
    # abouti et le pod ne serait jamais passé Ready. Constaté en interrogeant
    # réellement l'image avant déploiement.
    healthPath: /healthz
    readyPath: /readyz
    isSpringBoot: false
    secretRef: qualitos-ai-service
    env:
      QOS_ENV: prod
      QOS_DEV_AUTH: "0"
      OLLAMA_BASE_URL: http://ollama.qualitos.svc.cluster.local:11434
      QDRANT_URL: http://qdrant.qualitos.svc.cluster.local:6333
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }

  blockchain-service:
    # Optionnel : nécessite un réseau Hyperledger Fabric joignable (ADR 0012).
    enabled: false
    image: blockchain-service
    port: 8090
    replicas: 1
    isSpringBoot: true
    secretRef: qualitos-blockchain-service
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
