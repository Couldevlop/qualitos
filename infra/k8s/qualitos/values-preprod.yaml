# =============================================================================
# QualitOS — préproduction (namespace qualitos-preprod, cluster k3s mono-nœud).
# Surcharge values.yaml ; ne redéclare que ce qui diffère.
#
#   helm upgrade --install qualitos-preprod infra/k8s/qualitos \
#     -n qualitos-preprod -f infra/k8s/qualitos/values-preprod.yaml
# =============================================================================

global:
  # Le tag est POSÉ À L'INSTALLATION (--set global.imageTag=v0.1.0) et non figé
  # ici : `latest` sur un registre est une cible mouvante, et l'on veut savoir
  # quelle version tourne. La CI ne publie d'images que sur un tag vX.Y.Z.
  imageTag: ""
  imagePullPolicy: IfNotPresent
  # Pas de imagePullSecrets : les paquets GHCR du projet sont publics,
  # verifie par un tirage anonyme depuis le noeud. En declarer un
  # inscrirait un jeton dans le cluster sans rien apporter.
  keycloak:
    # URL PUBLIQUE : le chart en dérive KEYCLOAK_ISSUER_URI, qui doit
    # correspondre EXACTEMENT à l'émetteur inscrit dans les jetons. Une URL
    # interne ici et une publique côté navigateur donneraient deux émetteurs
    # différents, et toute validation de jeton échouerait en 401.
    url: https://preprod.qualitos.openlabconsulting.com/auth
    realm: qualitos

externalServices:
  postgresHost: postgres.qualitos-preprod.svc.cluster.local
  qdrantUrl: http://qdrant.qualitos-preprod.svc.cluster.local:6333
  # Service sans sélecteur pointant vers l'Ollama de l'hôte (cf. infra/k8s/deps).
  ollamaUrl: http://ollama.qualitos-preprod.svc.cluster.local:11434

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Le proxy plafonne les corps de requête à 1 Mo par défaut. L'API accepte des
    # pièces jointes jusqu'à 10 Mo (photos de NC, preuves CAPA) : sans ce
    # relèvement, elles seraient refusées par nginx AVANT d'atteindre
    # l'application, avec un 413 que rien ne rattacherait à sa cause — la même
    # panne silencieuse et en amont que la règle 911100 du pare-feu.
    # 12 Mo, et non 10 : l'enveloppe multipart s'ajoute au fichier. La borne qui
    # fait foi reste celle de l'application, qui répond un 413 explicite.
    nginx.ingress.kubernetes.io/proxy-body-size: 12m
    # Exclusion ModSecurity STRICTEMENT limitée à la configuration runtime de la
    # SPA. Le cluster active OWASP CRS globalement (ConfigMap du contrôleur), et
    # CRS 4.22 refuse GET /<locale>/assets/config.json avec un score d'anomalie
    # de 5. Conséquence en cascade : la SPA ne recevait pas sa configuration,
    # retombait sur les URL localhost compilées, et la CSP bloquait alors tous
    # ses appels — aucune page ne fonctionnait.
    #
    # L'exclusion ne porte QUE sur ce chemin, et uniquement sur cet ingress :
    # la règle reste active partout ailleurs, pour cette application comme pour
    # les autres projets du cluster. La ressource visée est un JSON statique
    # généré par nginx à partir de variables d'environnement — sans paramètre,
    # sans corps de requête, sans donnée utilisateur : il n'y a rien à y
    # protéger, et la levée n'ouvre aucune surface.
    #
    # Retrait de CRS 911100 (« method is not allowed by policy »). Sa liste par
    # défaut — GET, HEAD, POST, OPTIONS — décrit une application à formulaires,
    # pas une API REST. Résultat mesuré en préproduction : PUT, PATCH et DELETE
    # étaient refusés en 403 par le pare-feu AVANT toute authentification. La
    # moitié de la plateforme était donc muette sans que rien ne le signale :
    # conclure une cause racine (PUT), corriger un plan d'actions champ par champ
    # (PATCH), retirer une pièce jointe (DELETE) échouaient tous, et l'écran
    # affichait une erreur générique là où le serveur n'avait jamais été consulté.
    #
    # Ce que la levée n'ouvre PAS : les verbes redeviennent simplement lisibles
    # par l'application, qui décide seule de les accepter. L'authentification
    # (401), les habilitations (@PreAuthorize, RLS par tenant) et le reste des
    # règles CRS — injection, traversée de chemin, dépassement de score — restent
    # intacts. Une méthode autorisée par le WAF n'est pas une méthode autorisée
    # par l'API : c'est ce que montre la vérification, où DELETE sur un maillon
    # du milieu ressort en 409 parce que la règle métier le refuse.
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRule REQUEST_URI "@rx ^/[a-z]{2}/assets/config\.json$"         "id:1000100,phase:1,pass,nolog,ctl:ruleEngine=Off"
      SecRuleRemoveById 911100
  host: preprod.qualitos.openlabconsulting.com
  tls:
    enabled: true
    secretName: qualitos-preprod-tls

# Route publique de LECTURE des pièces jointes, vers le MinIO déployé par
# deploy.sh. Le bucket est privé : seule une URL présignée, valable quinze
# minutes, ouvre un objet. Sans cette route, les preuves seraient déposées et
# stockées correctement, mais aucun lien ne les ouvrirait.
objectStorage:
  enabled: true

# Un seul réplica partout : la machine héberge déjà six autres projets, et le
# disque est occupé à 80 %. La préproduction sert à valider un déploiement, pas
# à mesurer une tenue en charge.
services:
  web:
    # Configuration RUNTIME de la SPA. Sans elle, le bundle conserve les URL
    # localhost compilees dans environment.production.ts et ni la connexion ni
    # les appels API ne fonctionnent depuis un navigateur.
    env:
      QOS_API_BASE_URL: https://preprod.qualitos.openlabconsulting.com
      QOS_KEYCLOAK_ISSUER: https://preprod.qualitos.openlabconsulting.com/auth/realms/qualitos
      QOS_KEYCLOAK_CLIENT_ID: qualitos-web
      QOS_CONNECT_SRC: "'self' https://preprod.qualitos.openlabconsulting.com"
    # Variante non privilégiée de nginx : UID 101, port 8080.
    port: 8080
    runAsUser: 101
    replicas: 1
  api-core:
    replicas: 1
    env:
      DB_URL: jdbc:postgresql://postgres.qualitos-preprod.svc.cluster.local:5432/qualitos_core
  api-quality-engine:
    replicas: 1
    env:
      DB_URL: jdbc:postgresql://postgres.qualitos-preprod.svc.cluster.local:5432/qualitos_quality
      AI_SERVICE_URL: http://ai-service.qualitos-preprod.svc.cluster.local:8085
      # Mode bearer OBLIGATOIRE : l'ai-service valide reellement les jetons ici,
      # et rejette X-Dev-Claims. Sans ce reglage, toutes les fonctions d'IA
      # repondent 502 — c'est la panne constatee au premier deploiement.
      # Palier applique a tous les tenants tant que la facturation par tenant
      # n'existe pas. STANDARD ici : le compte de demonstration dispose ainsi du
      # socle standard, et le super admin peut lui ouvrir le reste. Le socle du
      # catalogue reste acquis d'office, quel que soit ce reglage.
      MODULES_DEFAULT_TIER: STANDARD
      AI_AUTH_MODE: bearer
      AI_TOKEN_URI: https://preprod.qualitos.openlabconsulting.com/auth/realms/qualitos/protocol/openid-connect/token
      AI_CLIENT_ID: api-quality-engine-ai
      QUALITOS_KAFKA_ENABLED: "false"
      # Stockage objet des pièces jointes (photos de NC §4.3, preuves CAPA §4.2).
      # Tant qu'il est coupé, les deux répondent 503 : l'écran annonce alors que
      # le stockage est désactivé sur cet environnement — franc, mais muet.
      #
      # DEUX endpoints, et ce n'est pas une redondance. Les écritures partent du
      # POD et visent le service interne. Les lectures sont ouvertes par le
      # NAVIGATEUR : leur URL présignée doit porter l'hôte public, sans quoi elle
      # serait signée correctement et pourtant inouvrable, sans qu'aucune erreur
      # ne remonte côté serveur. La signature couvrant l'hôte, on ne peut pas
      # corriger l'URL après coup.
      STORAGE_S3_ENABLED: "true"
      STORAGE_S3_ENDPOINT: http://minio.qualitos-preprod.svc.cluster.local:9000
      STORAGE_S3_PUBLIC_ENDPOINT: https://preprod.qualitos.openlabconsulting.com
      STORAGE_S3_BUCKET: qualitos-evidence
    # Second Secret : porte AI_CLIENT_SECRET, renseigne par deploy.sh depuis
    # Keycloak. Separe du premier pour que le secret du client de service ne se
    # melange pas aux identifiants de base.
    # Troisième Secret : les clés du stockage objet, dérivées du secret MinIO par
    # deploy.sh. Séparé pour la même raison — faire tourner une clé de stockage
    # ne doit pas obliger à toucher aux mots de passe de base.
    extraSecretRefs: [qualitos-api-quality-engine-ai, qualitos-api-quality-engine-storage]
  api-iot-hub:
    replicas: 1
    env:
      IOT_DB_URL: jdbc:postgresql://postgres.qualitos-preprod.svc.cluster.local:5432/qualitos_iot
      QUALITY_ENGINE_BASE_URL: http://api-quality-engine.qualitos-preprod.svc.cluster.local:8082
  ai-service:
    replicas: 1
    env:
      QOS_ENV: prod
      QOS_DEV_AUTH: "0"
      OLLAMA_BASE_URL: http://ollama.qualitos-preprod.svc.cluster.local:11434
      # Modele SERVI par l'Ollama de l'hote. Sans ce reglage, l'ai-service
      # retombe sur son defaut `llama3.1:8b`, absent de cette machine : chaque
      # appel echoue et l'engine le traduit en 502 — c'est la panne observee
      # sur les ecrans Anomalies et SPC. Lucie-7B est un modele francophone
      # souverain (OpenLLM-France), coherent avec l'exigence de souverainete.
      OLLAMA_MODEL: hf.co/OpenLLM-France/Lucie-7B-Instruct-v1.1-gguf:Q4_K_M
      # Le modele tourne sur CPU : la latence se compte en dizaines de
      # secondes. Le delai doit rester INFERIEUR au read-timeout de l'engine
      # (260 s), sinon l'engine coupe avant l'ai-service et l'on perd le
      # message d'erreur utile.
      OLLAMA_TIMEOUT_S: "240"
      # Fournisseur par defaut EXPLICITE. La valeur retombait deja sur ollama
      # faute de reglage, mais un defaut implicite se deplace sans qu'on le
      # voie : le poser ici garantit que les cinq capacites LLM — assistant,
      # generation documentaire, NLQ, RAG, audit a blanc — passent par
      # l'inference LOCALE et qu'aucune donnee ne sort du perimetre (SS12.2).
      AI_DEFAULT_PROVIDER: ollama
      # Validation des jetons de service. SANS ces deux valeurs, l'ai-service
      # n'a aucun emetteur de reference et refuse TOUT appel en 401 — c'est ce
      # qui produisait « Passerelle IA indisponible : 401 » sur tous les ecrans
      # d'IA, alors que l'engine obtenait pourtant un jeton valide.
      # L'emetteur doit correspondre EXACTEMENT a celui inscrit dans les jetons,
      # donc l'URL publique sous /auth, et non le service interne.
      KEYCLOAK_ISSUER: https://preprod.qualitos.openlabconsulting.com/auth/realms/qualitos
      KEYCLOAK_AUDIENCE: qualitos-ai
      # Clients de service autorises a porter le tenant via X-Tenant-Id (ADR 0048).
      # Un jeton client_credentials represente une machine : il ne porte AUCUN
      # tenant. Sans cette liste, l'ai-service refuse tout appel de l'engine en
      # 401 — meme avec un jeton parfaitement valide. La restriction sur l'`azp`
      # est ce qui empeche n'importe quel porteur de jeton de se declarer d'un
      # tenant qui n'est pas le sien. Doit correspondre a AI_CLIENT_ID cote engine.
      TRUSTED_SERVICE_AZP: api-quality-engine-ai
      # Embeddings du RAG (ADR 0049) : le calcul est delegue au serveur Ollama
      # deja deploye, qui sert BGE-M3 sans que l'image embarque torch. Le modele
      # doit etre tire une fois sur la machine : `ollama pull bge-m3`. Sans ce
      # reglage explicite, l'ai-service REFUSE de demarrer plutot que de retomber
      # sur des vecteurs de hachage : le RAG repondait alors avec des voisinages
      # arbitraires, sans que rien ne le signale.
      EMBEDDINGS_PROVIDER: ollama
      EMBEDDINGS_MODEL: bge-m3
      QDRANT_URL: http://qdrant.qualitos-preprod.svc.cluster.local:6333
      # L'allow-list des hotes IA (garde SSRF, OWASP A10) ne connait que le nom
      # court `ollama` du docker-compose. Sur Kubernetes le service porte un nom
      # pleinement qualifie : sans cette declaration, l'ai-service refuse tout
      # appel et redemarre en boucle. L'extension est additive.
      QOS_AI_ALLOWED_HOSTS: ollama.qualitos-preprod.svc.cluster.local
  blockchain-service:
    # Nécessite un réseau Hyperledger Fabric joignable (ADR 0012), absent ici.
    enabled: false

autoscaling:
  enabled: false
