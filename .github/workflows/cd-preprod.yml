name: CD préproduction

# Déploiement continu : tout code qui atteint `main` part automatiquement en
# préproduction, sans intervention.
#
# POURQUOI LA PRÉPRODUCTION ET PAS LA PRODUCTION. `main` est la branche
# d'intégration : y pousser doit produire un environnement observable, pas une
# mise en production. La promotion en production reste un acte explicite —
# `./infra/k8s/deploy.sh prod vX.Y.Z` — sur une version DÉJÀ éprouvée ici. C'est
# ce qui permet de dire, à tout moment, quelle version tourne en production et
# depuis quand. Pour automatiser aussi la production, il suffit de dupliquer le
# job `deploy` en visant `prod` ; le script est le même et il est idempotent.
#
# Les images sont étiquetées avec le SHA court du commit. Un déploiement continu
# ne peut pas s'appuyer sur `latest` : deux déploiements successifs seraient
# indiscernables, et un retour arrière impossible à désigner.

on:
  push:
    branches: [main]
  # Permet de rejouer un déploiement sans nouveau commit (reprise après incident).
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Étiquette d'image à déployer (défaut : construite depuis ce commit)"
        required: false
        type: string

concurrency:
  # Un seul déploiement à la fois : deux `helm upgrade` concurrents sur le même
  # release se corrompent mutuellement. On ne coupe PAS celui en cours — un
  # déploiement interrompu laisse le cluster dans un état indéterminé.
  group: cd-preprod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_PREFIX: ghcr.io/couldevlop/qualitos

jobs:
  images:
    name: Images — scan & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api-core,           context: ., dockerfile: apps/api-core/Dockerfile }
          - { service: api-quality-engine, context: ., dockerfile: apps/api-quality-engine/Dockerfile }
          - { service: api-iot-hub,        context: ., dockerfile: apps/api-iot-hub/Dockerfile }
          - { service: ai-service,         context: apps/ai-service, dockerfile: apps/ai-service/Dockerfile }
          - { service: web,                context: apps/web,        dockerfile: apps/web/Dockerfile }

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Étiquette d'image
        id: meta
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: >
          docker build -t "$IMAGE_PREFIX/${{ matrix.service }}:${{ steps.meta.outputs.tag }}"
          -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      # Règle §18.2.6 : aucun déploiement sans scan vert. Le scan est BLOQUANT,
      # exactement comme sur la release — un déploiement automatique ne doit pas
      # être l'occasion de relâcher le contrôle.
      - name: Trivy scan (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE_PREFIX/${{ matrix.service }}:${{ steps.meta.outputs.tag }}"

  deploy:
    name: Déploiement préproduction
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 30
    # Sans le secret de connexion, on saute proprement au lieu d'échouer à chaque
    # push : le dépôt reste utilisable par quelqu'un qui n'a pas accès au cluster.
    if: github.repository == 'Couldevlop/qualitos'
    environment:
      name: preprod
      url: https://preprod.qualitos.openlabconsulting.com

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Étiquette d'image
        id: meta
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Vérifier la présence du secret de connexion
        id: guard
        run: |
          if [ -z "${{ secrets.CLUSTER_SSH_KEY }}" ]; then
            echo "::warning::Secret CLUSTER_SSH_KEY absent — déploiement ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la clé SSH
        if: steps.guard.outputs.ok == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.CLUSTER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Empreinte epinglee : sans elle, StrictHostKeyChecking=no accepterait
          # n'importe quel hote se presentant a cette adresse.
          printf '%s\n' "${{ secrets.CLUSTER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transférer les manifestes
        if: steps.guard.outputs.ok == 'true'
        run: |
          # Les fins de ligne sont normalisees a la volee : un script shell en
          # CRLF echoue sur « bash\r: No such file or directory ».
          tar -cz infra | ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.CLUSTER_SSH_USER }}@${{ secrets.CLUSTER_SSH_HOST }}" \
            'rm -rf /tmp/qos-cd && mkdir -p /tmp/qos-cd && tar -xz -C /tmp/qos-cd \
             && find /tmp/qos-cd -type f \( -name "*.sh" -o -name "*.yaml" -o -name "*.json" \) \
                  -exec sed -i "s/\r$//" {} + \
             && chmod +x /tmp/qos-cd/infra/k8s/deploy.sh /tmp/qos-cd/infra/k8s/deps/render-realm.sh'

      - name: Déployer
        if: steps.guard.outputs.ok == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.CLUSTER_SSH_USER }}@${{ secrets.CLUSTER_SSH_HOST }}" \
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && cd /tmp/qos-cd \
             && ./infra/k8s/deploy.sh preprod '${{ github.event.inputs.image_tag || steps.meta.outputs.tag }}'"

      - name: Vérifier que l'application répond
        if: steps.guard.outputs.ok == 'true'
        run: |
          # Un `helm upgrade --wait` réussi ne prouve que la santé des pods.
          # On vérifie ici ce que voit réellement un navigateur.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -m 20 \
              https://preprod.qualitos.openlabconsulting.com/fr/ || true)
            [ "$code" = "200" ] && echo "application accessible (HTTP $code)" && exit 0
            sleep 15
          done
          echo "::error::L'application ne répond pas après déploiement (dernier code : $code)"
          exit 1
